name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # headless build: no display in CI, and the tests never open a real camera
          pip install opencv-python-headless numpy

      - name: Compile all sources
        run: python -m compileall -q webcam_stream.py webcam_gui.py settings_store.py

      - name: Server and capture tests
        run: python tests/test_server.py

      - name: Settings and window tests
        run: python tests/test_gui.py

  windows-exe:
    name: portable exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build WebcamStream.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --noupx
          --name WebcamStream webcam_gui.py

      - name: Smoke test the exe
        shell: pwsh
        run: |
          if (-not (Test-Path dist/WebcamStream.exe)) { throw "exe was not produced" }
          $size = (Get-Item dist/WebcamStream.exe).Length / 1MB
          Write-Host ("built WebcamStream.exe, {0:N1} MB" -f $size)
          if ($size -lt 10) { throw "exe looks suspiciously small" }

      - uses: actions/upload-artifact@v4
        with:
          name: WebcamStream-windows
          path: dist/WebcamStream.exe
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/WebcamStream.exe
          --title "$GITHUB_REF_NAME" --notes ""
